name: Security Audit & Executive Report (Web & APK)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Website URL (e.g. https://example.com) OR Play Store / Package ID (e.g. com.spotify.music)'
        required: true
        default: 'https://example.com'
        type: string
      gemini_api_key:
        description: 'Optional Gemini API Key (defaults to repo secret GEMINI_API_KEY)'
        required: false
        type: string
  repository_dispatch:
    types: [run-audit]

jobs:
  audit:
    name: Automated Security Audit Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17 (for JADX Decompiler)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Security Audit Pipeline
        id: run_audit
        env:
          TARGET_INPUT: ${{ github.event.inputs.target || github.event.client_payload.target || 'https://example.com' }}
          API_KEY_INPUT: ${{ github.event.inputs.gemini_api_key || github.event.client_payload.gemini_api_key || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ github.event.inputs.gemini_api_key || github.event.client_payload.gemini_api_key || secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ github.event.inputs.gemini_api_key || github.event.client_payload.gemini_api_key || secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p output_reports
          python -c "
          import os
          import json
          from core.orchestrator import AuditOrchestrator
          from server.main import generate_report_html
          
          target = os.environ.get('TARGET_INPUT', 'https://example.com').strip()
          api_key = os.environ.get('API_KEY_INPUT') or None
          is_web = target.startswith(('http://', 'https://')) and 'play.google.com/store/apps' not in target
          
          print(f'[GITHUB ACTION] Starting cloud audit for: {target} (Type: {\"Website\" if is_web else \"Android APK\"})')
          
          orchestrator = AuditOrchestrator()
          if api_key:
              orchestrator.ai_auditor.__init__(api_key=api_key)
              
          if is_web:
              report = orchestrator.run_web_audit(target)
          else:
              report = orchestrator.run_audit(target, is_url=True)
          
          # Save JSON
          with open('output_reports/report.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, indent=2)
              
          # Save Standalone Printable HTML Report
          html_content = generate_report_html(report, auto_print=False)
          with open('output_reports/report.html', 'w', encoding='utf-8') as f:
              f.write(html_content)
              
          # Format Markdown Summary for GitHub Actions Run Page
          score_data = report.get('score_data', {})
          app_info = report.get('app_info', {})
          tech_info = report.get('tech_info', {})
          counts = score_data.get('counts', {})
          target_name = app_info.get('domain') or app_info.get('package') or target
          target_title = app_info.get('title') or target_name
          
          md_lines = [
              f'# 🛡️ Executive Security Audit Report: {target_title}',
              f'**Target:** `{target_name}` | **Type:** `{\"🌐 Website\" if is_web else \"📱 Android APK\"}` | **Version/Status:** `{app_info.get(\"version_name\", \"1.0\")}`',
              f'**Framework:** `{tech_info.get(\"primary_framework\", \"Web / Native\")} ` | **Server/Target SDK:** `{app_info.get(\"target_sdk\", \"N/A\")}`',
              '',
              f'## 📊 Security Posture Score: **{score_data.get(\"score\", 0)}/100** ({score_data.get(\"risk_level\", \"AUDITED\")})',
              '',
              '| Severity | Count | Level |',
              '| :--- | :--- | :--- |',
              f'| 🔴 CRITICAL | **{counts.get(\"CRITICAL\", 0)}** | Urgent Exploit Exposure |',
              f'| 🟠 HIGH | **{counts.get(\"HIGH\", 0)}** | Systemic Vulnerability |',
              f'| 🟡 MEDIUM | **{counts.get(\"MEDIUM\", 0)}** | Hardening Needed |',
              f'| 🔵 LOW | **{counts.get(\"LOW\", 0)}** | Minor Leakage |',
              f'| ⚪ INFO | **{counts.get(\"INFO\", 0)}** | Observability / Informational |',
              '',
              '## 📋 Executive Briefing',
              report.get('executive_summary', 'No summary available.'),
              '',
              '## 🔥 Top Remediation Priorities'
          ]
          
          priorities = report.get('fix_these_first', [])
          if not priorities:
              md_lines.append('*No immediate critical security blockades found.*')
          else:
              for prio in priorities:
                  md_lines.append(f'- **#{prio.get(\"priority\")} [{prio.get(\"severity\")}] {prio.get(\"title\")}**')
                  md_lines.append(f'  - *Impact:* {prio.get(\"potential_impact\")}')
                  md_lines.append(f'  - *Action Required:* {prio.get(\"action_required\")}')
              
          md_content = \"\n\".join(md_lines)
          with open('output_reports/summary.md', 'w', encoding='utf-8') as f:
              f.write(md_content)
              
          # Append to GitHub Step Summary
          if 'GITHUB_STEP_SUMMARY' in os.environ:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as sf:
                  sf.write(md_content)
          "

      - name: Upload Security Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report-${{ github.run_id }}
          path: output_reports/
