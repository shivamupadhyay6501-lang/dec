name: Security Audit & Executive Report (Web & APK)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Website URL (e.g. https://example.com) OR Play Store / Package ID (e.g. com.spotify.music)'
        required: true
        default: 'https://example.com'
        type: string
      target_type:
        description: 'Target Type: auto, web (Website URL), or apk (Android App)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - web
          - apk
      scan_id:
        description: 'Audit Scan Identifier'
        required: false
        default: ''
        type: string
      gemini_api_key:
        description: 'Optional Gemini API Key (defaults to repo secret GEMINI_API_KEY)'
        required: false
        type: string
  repository_dispatch:
    types: [run-audit]

jobs:
  audit:
    name: Automated Security Audit Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17 (for JADX Decompiler)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Security Audit Pipeline
        id: run_audit
        env:
          PYTHONPATH: .
          TARGET_INPUT: ${{ github.event.inputs.target || github.event.client_payload.target || 'https://example.com' }}
          TARGET_TYPE_INPUT: ${{ github.event.inputs.target_type || github.event.client_payload.target_type || 'auto' }}
          SCAN_ID_INPUT: ${{ github.event.inputs.scan_id || github.event.client_payload.scan_id || '' }}
          API_KEY_INPUT: ${{ github.event.inputs.gemini_api_key || github.event.client_payload.gemini_api_key || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ github.event.inputs.gemini_api_key || github.event.client_payload.gemini_api_key || secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ github.event.inputs.gemini_api_key || github.event.client_payload.gemini_api_key || secrets.GEMINI_API_KEY }}
        run: |
          python scripts/run_cloud_audit.py

      - name: Upload Security Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report-${{ github.run_id }}
          path: output_reports/
